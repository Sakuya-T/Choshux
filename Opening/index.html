<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choshux - Opening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #1e1e38 0%, #0d0e15 100%);
      font-family: 'Montserrat', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* 背景の装飾光 */
    .glow-circle {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(139, 92, 246, 0.05) 50%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
      animation: floatGlow 10s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% {
        transform: translate(-60px, -40px) scale(0.9);
      }
      100% {
        transform: translate(60px, 40px) scale(1.1);
      }
    }

    /* メインコンテナ（グラスモーフィズムデザイン） */
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 3.5rem 2.5rem;
      max-width: 600px;
      width: 90%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1.1rem;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(129, 140, 248, 0.3);
      color: #c7d2fe;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 10%, #e2e8f0 60%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      margin: 1.25rem auto 1.75rem;
      border-radius: 2px;
    }

    .message {
      font-size: 1.2rem;
      color: #f1f5f9;
      line-height: 1.8;
      font-weight: 400;
      margin-bottom: 1.2rem;
    }

    .sub-message {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 2.25rem;
      line-height: 1.6;
    }

    /* アクションボタン */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 2.25rem;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px -5px rgba(99, 102, 241, 0.55);
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* クリック時に展開する追加メッセージ領域 */
    .extra-content {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      padding: 0 1.25rem;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid transparent;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .extra-content.open {
      max-height: 160px;
      opacity: 1;
      margin-top: 1.75rem;
      padding: 1.25rem;
      border-color: rgba(129, 140, 248, 0.25);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="glow-circle"></div>

  <main class="card">
    <span class="badge">Welcome</span>
    <h1>Choshux</h1>
    <div class="divider"></div>
    <p class="message">ようこそ、Choshuxの世界へ。</p>
    <p class="sub-message">ここから新しい物語と体験が始まります。<br>準備ができたら下のボタンを押してください。</p>
    
    <button id="startBtn" class="btn">
      <span>はじめる</span>
      <span aria-hidden="true">→</span>
    </button>

    <div id="extraContent" class="extra-content">
      <p>🎉 オープニングへアクセスいただきありがとうございます！</p>
      <p>プロジェクトの準備が完了しました。どうぞお楽しみください。</p>
    </div>
  </main>

  <script>
    const startBtn = document.getElementById('startBtn');
    const extraContent = document.getElementById('extraContent');

    startBtn.addEventListener('click', () => {
      extraContent.classList.toggle('open');
      if (extraContent.classList.contains('open')) {
        startBtn.innerHTML = '<span>とじる</span>';
      } else {
        startBtn.innerHTML = '<span>はじめる</span> <span aria-hidden="true">→</span>';
      }
    });
  </script>
</body>
</html>
